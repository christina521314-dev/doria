<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="landscape">
    <meta name="mobile-web-app-capable" content="yes">
    <title>抓蕉猴 - 游戏Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        .game-container {
            background: #2c3e50;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 手机横屏优化：移除边距和圆角，让游戏占满屏幕 */
        @media (max-width: 900px) and (orientation: landscape) {
            body {
                padding: 0;
            }
            
            .game-container {
                border-radius: 0;
                padding: 0;
                width: 100vw;
                height: 100vh;
                box-shadow: none;
            }
        }

        .game-canvas-wrapper {
            position: relative;
            background: #34495e;
            border: 4px solid #34495e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
            /* 固定游戏逻辑尺寸 */
            width: 1280px;
            height: 720px;
            /* 等比缩放适配 */
            max-width: 100%;
            max-height: calc(100vh - 80px);
        }

        /* 手机横屏：让游戏占满整个屏幕 */
        @media (max-width: 900px) and (orientation: landscape) {
            .game-canvas-wrapper {
                border: none;
                border-radius: 0;
                width: 100vw;
                height: 100vh;
                max-width: 100vw;
                max-height: 100vh;
            }
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            /* 保持宽高比 */
            object-fit: contain;
            touch-action: none;
        }

        /* 手机横屏：canvas保持宽高比，尽可能大 */
        @media (max-width: 900px) and (orientation: landscape) {
            #gameCanvas {
                width: 100%;
                height: 100%;
                object-fit: contain;  /* 保持宽高比，完整显示 */
            }
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-size: 2em;
            z-index: 100;
            border-radius: 10px;
            pointer-events: none; /* 默认允许点击穿透到canvas */
        }
        
        .game-overlay.show {
            pointer-events: none; /* 显示时也允许点击穿透，让canvas上的按钮可以点击 */
        }

        .game-overlay.show {
            display: flex;
        }

        .overlay-message {
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-align: center;
            padding: 0 20px;
        }

        .victory {
            color: #f1c40f;
        }

        .defeat {
            color: #e74c3c;
        }

        @media (max-width: 1400px) {
            .game-canvas-wrapper {
                transform: scale(0.9);
                transform-origin: top center;
            }
        }

        @media (max-width: 1200px) {
            .game-canvas-wrapper {
                transform: scale(0.85);
            }
        }

        /* 手机横屏：移除缩放，让游戏占满屏幕 */
        @media (max-width: 900px) and (orientation: landscape) {
            .game-canvas-wrapper {
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                transform: none !important;
                transform-origin: center;
            }
            
            #gameCanvas {
                width: 100vw !important;
                height: 100vh !important;
            }
        }

        /* 手机竖屏：保持较小缩放 */
        @media (max-width: 900px) and (orientation: portrait) {
            .game-canvas-wrapper {
                transform: scale(0.5);
            }
        }

        /* 横屏提示 */
        .landscape-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10000;
            color: white;
            font-size: 24px;
            text-align: center;
            padding: 20px;
        }

        .landscape-prompt.show {
            display: flex;
        }

        .landscape-prompt-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: rotate 2s infinite;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div class="game-overlay" id="gameOverlay">
                <div class="overlay-message" id="overlayMessage"></div>
            </div>
        </div>
    </div>

    <!-- 横屏提示 -->
    <div class="landscape-prompt" id="landscapePrompt">
        <div class="landscape-prompt-icon">📱</div>
        <div style="font-size: 32px; font-weight: bold; margin-bottom: 20px;">请横屏游戏</div>
        <div style="font-size: 20px;">请将手机旋转至横屏模式<br/>以获得最佳游戏体验</div>
    </div>

    <script src="main.js?v=2.7"></script>
    <script>
        // ========== 背景图片配置（第231行开始 - 可自定义调整） ==========
        // 远、中、近景的位置和尺寸配置
        // 调整说明：
        //   - x, y: 图片绘制位置（x: 左右偏移，y: 上下偏移）
        //   - width, height: 图片绘制尺寸（如果设为null，则使用图片原始尺寸或GAME_WIDTH/GAME_HEIGHT）
        //   - 地面位置：GAME_HEIGHT - 100 = 620
        // 背景偏移参数配置（第236行开始 - 可自定义调整）
        // 调整说明：
        //   - x: 左右偏移（正数向右，负数向左）
        //   - y: 上下偏移（正数向下，负数向上）
        //   - 地面位置：GAME_HEIGHT - 100 = 620px
        // ================================================
        
        // ========== 游戏配置参数（可手动调整） ==========
        // 陷阱相邻最小距离（像素）- 增大此值可以让陷阱之间距离更远
        const TRAP_MIN_DISTANCE = 450; // 从200增加到250，让间距更大
        // 陷阱位置随机偏移范围（像素）- 增大此值可以让陷阱位置更随机，避免过于平均
        const TRAP_RANDOM_OFFSET = 400; // 默认400像素，可根据需要调整（0表示不随机）
        // 陷阱间距随机倍数范围 - [min, max]，值越大间距越随机
        const TRAP_SPACING_RANDOM_MIN = 0.2; // 最小倍数（更小的值允许更短的间距）
        const TRAP_SPACING_RANDOM_MAX = 3.5; // 最大倍数（更大的值允许更长的间距）
        // 相邻陷阱间距最小差异（像素）- 确保相邻陷阱间距差异明显
        const TRAP_DISTANCE_MIN_DIFF = 120; // 相邻陷阱间距至少相差80像素，让差异更明显
        
        // ================================================
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverlay = document.getElementById('gameOverlay');
        const overlayMessage = document.getElementById('overlayMessage');
        const landscapePrompt = document.getElementById('landscapePrompt');

        // 固定游戏逻辑尺寸（使用配置）
        const GAME_WIDTH = GAME_CONFIG.width;
        const GAME_HEIGHT = GAME_CONFIG.height;

        // 计算地面Y坐标（基于配置）
        const GROUND_Y = GAME_HEIGHT - GROUND_CONFIG.offsetFromBottom;

        // 调试：验证配置是否正确加载
        console.log('=== 游戏配置加载检查 ===');
        console.log('玩家尺寸:', PLAYER_CONFIG.width, 'x', PLAYER_CONFIG.height);
        console.log('目标猴子尺寸:', TARGET_MONKEY_CONFIG.width, 'x', TARGET_MONKEY_CONFIG.height);
        console.log('普通猴子尺寸:', NORMAL_MONKEY_CONFIG.width, 'x', NORMAL_MONKEY_CONFIG.height);
        console.log('山脉Y位置:', BACKGROUND_CONFIG.mid.y);
        console.log('地面Y位置:', GROUND_Y);
        console.log('========================');

        // 背景图片对象（只保留中景）
        const backgroundImages = {
            mid: null    // 中景 bg_m（山脉层）
        };

        // 玩家图片对象
        const heroStayImg = new Image();
        heroStayImg.src = 'hero_stay.png?v=' + Date.now();
        const heroWorkImg = new Image();
        heroWorkImg.src = 'hero_work.png?v=' + Date.now();

        // 普通猴子图片对象
        const fakeMonkeyImg = new Image();
        fakeMonkeyImg.src = 'fake monkey.png?v=' + Date.now();

        // 目标猴子图片对象
        const targetMonkeyStayImg = new Image();
        targetMonkeyStayImg.src = 'monkey_stay.png?v=' + Date.now();
        const targetMonkeyRunImg = new Image();
        targetMonkeyRunImg.src = 'monkey_run.png?v=' + Date.now();

        // 香蕉树图片对象
        const treeImg = new Image();
        treeImg.src = 'tree.png?v=' + Date.now();

        // 陷阱图片对象
        const trapImg = new Image();
        trapImg.src = 'trap.png?v=' + Date.now();

        // 背景音乐
        const bgMusic = new Audio('偷香蕉的猴子.mp3');
        bgMusic.loop = true;  // 从头到尾循环播放

        // 确保图片加载完再渲染，防止"游戏不动"
        let assetsLoaded = 0;
        const totalGameAssets = 7; // 玩家2张 + 普通猴子1张 + 目标猴子2张 + 香蕉树1张 + 陷阱1张
        const gameAssets = [heroStayImg, heroWorkImg, fakeMonkeyImg, targetMonkeyStayImg, targetMonkeyRunImg, treeImg, trapImg];
        gameAssets.forEach(img => {
            img.onload = () => { 
                assetsLoaded++; 
                if(assetsLoaded === totalGameAssets) console.log("所有游戏资源加载完成!"); 
            };
            img.onerror = (e) => {
                console.error(`图片加载失败: ${img.src}`, e);
            };
        });

        // 背景配置已移至 main.js（只保留中景层配置）

        // 加载背景图片（只加载中景山脉层）
        function loadBackgroundImages() {
            backgroundImages.mid = new Image();
            backgroundImages.mid.src = 'bg_m.png?v=' + Date.now();  // 中景图片（山脉层）
            
            // 添加加载完成回调
            backgroundImages.mid.onload = () => {
                console.log('中景图片(bg_m.png)加载完成');
            };
            
            // 加载失败时的处理
            backgroundImages.mid.onerror = (e) => {
                console.error('中景图片(bg_m.png)加载失败:', e);
                console.error('请确认文件是否存在且路径正确');
            };
        }

        // 设置画布尺寸（固定为游戏逻辑尺寸）
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // 检测是否为移动设备
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                        ('ontouchstart' in window) || 
                        (navigator.maxTouchPoints > 0);

        // 检测屏幕方向并显示/隐藏横屏提示
        function checkOrientation() {
            if (!isMobile) return; // 只在移动设备上检测
            
            const isPortrait = window.innerHeight > window.innerWidth;
            if (isPortrait) {
                landscapePrompt.classList.add('show');
            } else {
                landscapePrompt.classList.remove('show');
            }
        }

        // 监听屏幕方向变化
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        // 初始检测
        checkOrientation();

        // 相机系统（用于画面滚动）
        const camera = {
            x: 0,
            y: 0,
            targetX: 0,
            followSpeed: 0.1
        };

        // 游戏世界坐标（无限延伸）
        let worldX = 0; // 世界X坐标

        // 猴子挑衅系统配置（可自定义调整）- 第174行
        // 在这里可以调整话语的显示速度和间隔时间
        // ⚠️ 必须在 gameState 之前定义，因为 gameState 会使用这个配置
        const MONKEY_TAUNT_CONFIG = {
            // 各距离等级的显示时间（秒）- 话语显示多久后消失
            // 数值越大，话语显示越久，变化越慢
            displayDuration: {
                far: 4.0,        // 很远（>800像素）- 4秒，可改成 6.0、7.0 等
                medium: 4.5,     // 中等（400-800像素）- 4.5秒
                close: 4.0,      // 较近（200-400像素）- 4秒
                veryClose: 3.5   // 很近（<200像素）- 3.5秒
            },
            
            // 等待时间（秒）- 话语消失后等待多久再显示下一句
            // 数值越大，话语间隔越长，变化越慢
            // 可改成 5.0、6.0、8.0 等
            waitDuration: 3.0
        };

        // 游戏状态
        let gameState = {
            running: false,
            gameOver: false,
            victory: false,
            score: 0,
            distance: 0,
            bananas: 0,                    // 当前香蕉数量（由关卡发放）
            monkeyOutOfViewTime: 0,        // 猴子离开视野的时间
            isWorking: false,              // 是否在干活
            workProgress: 0,                // 干活进度（0-1）
            nearBananaTree: null,          // 接近的香蕉树（null表示没有）
            currentLevel: 0,               // 当前关卡索引
            lastLevelChangeDistance: 0,    // 上次关卡切换时的距离
            levelBananasReceived: false,    // 当前关卡是否已发放香蕉
            levelComplete: false,           // 关卡是否完成
            levelCompleteTime: 0,           // 关卡完成时间（用于动画）
            nextLevelDelay: 2.5,            // 进入下一关的延迟时间（秒）
            failedLevel: null,             // 失败时的关卡索引（null表示从第一关开始）
            dynamicMonkeySpawnTimer: 0,    // 动态猴子生成计时器
            tutorialShown: {               // 引导提示状态
                firstBananaTree: false,    // 是否已显示第一次遇到香蕉树的引导
                preGameInstructionsShown: false  // 是否已显示游戏开始前的说明
            },
            levelNotificationTimer: 0,     // 关卡提示显示计时器
            levelNotificationShown: false, // 是否已显示关卡提示
            speedMultiplier: 1.0,          // 速度倍数（初始为1.0）
            baseMaxSpeed: 8,               // 玩家基础最大速度（存储原始值）
            baseMonkeySpeed: 5,            // 猴子基础速度（存储原始值）
            obstacleSequenceIndex: 0,      // 障碍物生成顺序索引
            monkeyTaunt: {                 // 猴子挑衅状态
                currentText: '',           // 当前显示的文字
                distanceLevel: 'far',      // 当前距离等级
                displayTime: 0,            // 当前气泡显示时间（秒）
                displayDuration: 2.5,      // 气泡显示持续时间（秒）- 默认值，会被动态调整
                waitTime: 3,               // 等待时间（秒）- 气泡消失后的等待时间
                waitDuration: 3.0,         // 等待时间（秒）- 使用配置值（第190行可调整），初始化为3.0
                opacity: 0,                // 透明度（用于淡入淡出）
                floatOffset: 0,            // 浮动偏移量
                isWaiting: false           // 是否在等待状态
            },
            musicOn: (function() {
                try {
                    const saved = localStorage.getItem('doria_musicOn');
                    return saved !== null ? saved === 'true' : true;
                } catch (e) { return true; }
            })()                  // 背景音乐开关（从本地存储恢复，默认开启）
        };

        // 保存设置到本地
        function saveSettings() {
            try {
                localStorage.setItem('doria_musicOn', String(gameState.musicOn));
            } catch (e) { /* 忽略存储异常 */ }
        }

        // 从配置中更新 waitDuration（避免初始化顺序问题）
        gameState.monkeyTaunt.waitDuration = MONKEY_TAUNT_CONFIG.waitDuration;

        // 时间系统设置
        const TIME_SETTINGS = {
            outOfViewTimeLimit: 1.8,       // 猴子离开视野的时间限制（秒）- 缩短到1.8秒，增加紧迫感
            warningTime: 1.0,              // 警告时间（剩余1.0秒时显示警告）
            checkInterval: 0.1             // 检测间隔（秒）
        };

        // 香蕉系统设置
        const BANANA_SETTINGS = {
            initialBananas: 0,             // 初始香蕉数量（改为0，由关卡发放）
            workTime: 1.0,                 // 干活时间（秒）- 缩短到3.0秒
            workReward: 2,                 // 干活获得的香蕉 - 从3降低到2，增加难度
            skipCost: 4,                   // 跳过消耗的香蕉 - 从3增加到4，提高成本
            minBananas: 0,                 // 最少香蕉数量（不能为负）
            proximityDistance: 120,       // 接近距离 - 从80增加到120，给玩家更多时间
            preProximityDistance: 150      // 预接近距离 - 提前显示提示
        };

        // 香蕉树配置已移至 main.js，使用 TREE_CONFIG

        // 障碍物生成节奏模板（按关卡定义顺序）
        const OBSTACLE_RHYTHM_PATTERNS = {
            0: ['empty', 'tree', 'empty', 'tree', 'empty', 'trap', 'tree', 'empty'], // 第一关：安全为主
            1: ['trap', 'empty', 'tree', 'empty', 'trap', 'tree', 'empty', 'monkey'], // 第二关
            2: ['trap', 'monkey', 'tree', 'trap', 'empty', 'tree', 'monkey', 'empty'], // 第三关
            3: ['trap', 'monkey', 'tree', 'trap', 'monkey', 'tree', 'empty', 'trap'], // 第四关
            4: ['trap', 'monkey', 'tree', 'trap', 'monkey', 'tree', 'trap', 'empty'], // 第五关
            5: ['trap', 'monkey', 'tree', 'trap', 'monkey', 'tree', 'trap', 'monkey'], // 第六关
            6: ['trap', 'monkey', 'tree', 'trap', 'monkey', 'tree', 'trap', 'monkey'], // 第七关
            7: ['trap', 'monkey', 'tree', 'trap', 'monkey', 'tree', 'trap', 'monkey']  // 第八关
        };

        // 获取当前关卡的节奏模式
        function getCurrentRhythmPattern() {
            return OBSTACLE_RHYTHM_PATTERNS[gameState.currentLevel] || 
                   OBSTACLE_RHYTHM_PATTERNS[1]; // 默认使用第二关模式
        }

        // 获取下一个应该生成的障碍物类型
        function getNextObstacleType() {
            const pattern = getCurrentRhythmPattern();
            const type = pattern[gameState.obstacleSequenceIndex % pattern.length];
            return type;
        }

        // 推进障碍物生成顺序
        function advanceObstacleSequence() {
            gameState.obstacleSequenceIndex++;
        }

        // 关卡系统设置
        const LEVEL_SETTINGS = {
            levels: [
                {
                    name: '关卡1 - 新手训练',
                    startDistance: 0,
                    endDistance: 500,
                    trapSpacing: 2500,          // 增加到2500，陷阱更稀疏
                    trapProbability: 0.008,      // 进一步降低到0.008（0.8%）
                    treeSpacing: 350,           // 从400降低到350，增加香蕉树密度
                    treeProbability: 0.95,       // 提高到0.95，几乎必出香蕉树
                    monkeySpacing: 9999,        // 极大值，几乎不生成
                    monkeyProbability: 0,       // 完全移除
                    bananaReward: 12,           // 增加到12，给更多初始香蕉
                    dynamicMonkeyEnabled: false, // 第一关不启用动态猴子
                    dynamicMonkeySpawnInterval: 999 // 很长的间隔
                },
                {
                    name: '关卡2 - 逐渐适应',
                    startDistance: 500,
                    endDistance: 1000,
                    trapSpacing: 600,           // 从400增加到600，间距更大
                    trapProbability: 0.35,       // 从0.4降低到0.35
                    treeSpacing: 500,           // 从450增加到500
                    treeProbability: 0.95,       // 从0.7提高到0.75
                    monkeySpacing: 800,         // 从600增加到800，普通猴子更少
                    monkeyProbability: 0.25,     // 从0.3降低到0.25
                    bananaReward: 5,            // 从4增加到5
                    dynamicMonkeyEnabled: true,  // 第二关开始启用
                    dynamicMonkeySpawnInterval: 18.0 // 从15增加到18
                },
                {
                    name: '关卡3 - 挑战升级',
                    startDistance: 1000,
                    endDistance: 1500,
                    trapSpacing: 350,           // 从280增加到350
                    trapProbability: 0.85,       // 从0.6降低到0.55
                    treeSpacing: 420,           // 从350增加到420

            velocity += acceleration;

            current += velocity;

        function easeLinearInterpolate(t) {
            // linear(0, 0.402 7.4%, 0.711 15.3%, 0.929 23.7%, 1.008 28.2%, 1.067 33%, 1.099 36.9%, 1.12 41%, 1.13 45.4%, 1.13 50.1%, 1.111 58.5%, 1.019 83.2%, 1.004 91.3%, 1)
            const keyframes = [
                [0, 0],
                [0.074, 0.402],
                [0.153, 0.711],
                [0.237, 0.929],
                [0.282, 1.008],
                [0.33, 1.067],
                [0.369, 1.099],
                [0.41, 1.12],
                [0.454, 1.13],
                [0.501, 1.13],
                [0.585, 1.111],
                [0.832, 1.019],
                [0.913, 1.004],
                [1, 1]
            ];
            
            // 限制 t 在 0-1 范围内
            t = Math.max(0, Math.min(1, t));
            
            // 找到对应的区间
            for (let i = 0; i < keyframes.length - 1; i++) {
                const [t1, v1] = keyframes[i];
                const [t2, v2] = keyframes[i + 1];
                if (t >= t1 && t <= t2) {
                    // 线性插值
                    const ratio = (t - t1) / (t2 - t1);
                    return v1 + (v2 - v1) * ratio;
                }
            }
            return t; // 默认返回原值
        }

                '追得这么近，那我可要加速了！拜拜！💨',
                '你的手指是不是在抖？哈哈！手抖了吧！'
            ]
        };

        // 关卡系统函数
        function getCurrentLevel(distance) {
            for (let i = 0; i < LEVEL_SETTINGS.levels.length; i++) {
                const level = LEVEL_SETTINGS.levels[i];
                if (distance >= level.startDistance && distance < level.endDistance) {
                    return i;
                }
            }
            // 如果超出所有关卡，返回最后一个关卡
            return LEVEL_SETTINGS.levels.length - 1;
        }

        function getCurrentLevelSettings() {
            return LEVEL_SETTINGS.levels[gameState.currentLevel];
        }

        // 简单的伪随机数生成器（使用种子，确保每个关卡障碍物固定）
        function seededRandom(seed) {
            let value = seed;
            return function() {
                value = (value * 9301 + 49297) % 233280;
                return value / 233280;
            };
        }

        // 陷阱生成相关
        let lastTrapX = 0; // 最后一个陷阱的X坐标
        const trapGenerationDistance = 2000; // 提前生成陷阱的距离

        // 初始化陷阱
        function initTraps() {
            traps.length = 0;
            // 玩家在100，猴子在500，安全区域600，所以从700开始生成陷阱
            const safeZone = 600;
            const startX = 100 + safeZone; // 玩家位置 + 安全区域
            lastTrapX = startX;
            generateTraps(startX, startX + 2000); // 从安全区域之后开始生成陷阱
        }

        // 动态生成陷阱（简化版：基于间距循环）
        function generateTraps(startX, endX) {
            const groundY = GROUND_Y;
            let maxGeneratedX = startX;
            const levelSettings = getCurrentLevelSettings();
            const trapSpacing = levelSettings.trapSpacing;
            const trapProbability = levelSettings.trapProbability;
            
            // 判断是否为第一关
            const isFirstLevel = (gameState.currentLevel === 0);
            
            // 第一关：前段区域完全不生成陷阱
            const firstLevelSafeZone = isFirstLevel ? 250 : 0; // 250像素安全区
            
            // 使用关卡索引作为随机种子，确保每个关卡的障碍物固定
            const seed = gameState.currentLevel * 1000 + Math.floor(startX / 100);
            const random = seededRandom(seed);
            
            // 按间距循环生成（简化逻辑，与香蕉树、普通猴子一致）
            for (let x = startX; x < endX; x += trapSpacing) {
                maxGeneratedX = x;
                
                // 第一关前段区域跳过
                if (isFirstLevel && (x - startX) < firstLevelSafeZone) {
                    continue;
                }
                
                // 检查当前应该生成什么类型的障碍物（按节奏顺序）
                const nextObstacleType = getNextObstacleType();
                
                // 只有应该生成陷阱时才继续
                if (nextObstacleType !== 'trap' && nextObstacleType !== 'empty') {
                    continue; // 不是陷阱或空地，跳过（让其他生成函数处理）
                }
                
                // 如果是空地，推进顺序并跳过
                if (nextObstacleType === 'empty') {
                    advanceObstacleSequence();
                    continue;
                }
                
                // 检查概率
                if (random() > trapProbability) {
                    continue;
                }
                
                // 检查最小距离（检查与其他陷阱和香蕉树的距离）
                let tooClose = false;
                // 检查与其他陷阱的距离
                for (let existingTrap of traps) {
                    if (Math.abs(existingTrap.x - x) < TRAP_MIN_DISTANCE) {
                        tooClose = true;
                        break;
                    }
                }
                // 检查与香蕉树的距离
                if (!tooClose) {
                    for (let tree of bananaTrees) {
                        const distance = Math.abs(tree.x - x);
                        if (distance < PLATFORM_CONFIG.minDistanceFromTree) {
                            tooClose = true;
                            break;
                        }
                    }
                }
                
                // 如果距离合适，生成陷阱
                if (!tooClose) {
                    traps.push({
                        x: x,
                        y: groundY - trapHeight,  // 陷阱底部贴地，而不是顶部贴地
                        width: trapWidth,
                        height: trapHeight,
                        color: '#e74c3c'
                    });
                    maxGeneratedX = Math.max(maxGeneratedX, x);
                    
                    // 推进障碍物生成顺序
                    advanceObstacleSequence();
                }
            }
            
            // 更新最后一个陷阱位置
            lastTrapX = Math.max(lastTrapX, maxGeneratedX);
        }
        
        // 确保玩家前方始终有障碍
        function ensureTrapsAhead() {
            if (gameState.levelComplete || !gameState.running) return;
            
            const maxWorldX = Math.max(player.x, targetMonkey.x);
            // 第一关检查距离更远，让玩家有更多空间
            const checkDistance = gameState.currentLevel === 0 ? 1000 : 800;
            const checkStartX = maxWorldX + 400; // 从安全区域后开始检查
            const checkEndX = maxWorldX + checkDistance;
            
            // 检查这个范围内是否有陷阱
            let hasTrapInRange = false;
            for (let trap of traps) {
                if (trap.x >= checkStartX && trap.x <= checkEndX) {
                    hasTrapInRange = true;
                    break;
                }
            }
            
            // 如果前方没有陷阱，强制生成一个（使用固定种子的随机位置）
            if (!hasTrapInRange) {
                // 使用关卡索引作为随机种子，确保每个关卡固定
                const seed = gameState.currentLevel * 3000 + Math.floor(maxWorldX / 100);
                const random = seededRandom(seed);
                // 在检查范围内使用固定种子的随机生成位置
                const randomOffset = 200 + random() * (checkDistance - 400); // 在200到(checkDistance-200)之间随机
                const generateX = maxWorldX + randomOffset;
                
                // 检查与已有陷阱和香蕉树的距离，确保不小于最小距离
                let tooClose = false;
                // 检查与其他陷阱的距离
                for (let existingTrap of traps) {
                    const distance = Math.abs(existingTrap.x - generateX);
                    if (distance < TRAP_MIN_DISTANCE) {
                        tooClose = true;
                        break;
                    }
                }
                // 检查与香蕉树的距离
                if (!tooClose) {
                    for (let tree of bananaTrees) {
                        const distance = Math.abs(tree.x - generateX);
                        if (distance < PLATFORM_CONFIG.minDistanceFromTree) {
                            tooClose = true;
                            break;
                        }
                    }
                }
                
                // 只有当距离足够远时才生成陷阱
                if (!tooClose) {
                    traps.push({
                        x: generateX,
                        y: GROUND_Y - trapHeight,  // 陷阱底部贴地，而不是顶部贴地
                        width: trapWidth,
                        height: trapHeight,
                        color: '#e74c3c'
                    });
                    
                    lastTrapX = Math.max(lastTrapX, generateX);
                }
            }
        }

        // 清理屏幕外的陷阱
        function cleanupTraps() {
            // 只保留相机前方和后方一定范围内的陷阱
            const keepRange = 500;
            for (let i = traps.length - 1; i >= 0; i--) {
                if (traps[i].x < camera.x - keepRange || traps[i].x > camera.x + GAME_WIDTH + keepRange) {
                    traps.splice(i, 1);
                }
            }
        }

        // 初始化香蕉树
        function initBananaTrees() {
            bananaTrees.length = 0;
            // 玩家在100，猴子在500，安全区域600，所以从700开始生成香蕉树
            const safeZone = 600;
            const startX = 100 + safeZone; // 玩家位置 + 安全区域
            lastTreeX = startX;
            generateBananaTrees(startX, startX + 2000); // 从安全区域之后开始生成香蕉树
        }

        // 动态生成香蕉树（使用关卡参数）
        function generateBananaTrees(startX, endX) {
            const groundY = GROUND_Y;
            let maxGeneratedX = startX;
            const levelSettings = getCurrentLevelSettings();
            
            // 如果关卡没有香蕉树，直接返回
            if (levelSettings.treeSpacing === 0 || levelSettings.treeProbability === 0) {
                lastTreeX = Math.max(lastTreeX, endX);
                return;
            }
            
            // 使用关卡索引作为随机种子，确保每个关卡的香蕉树固定
            const seed = gameState.currentLevel * 2000 + Math.floor(startX / 100);
            const random = seededRandom(seed);
            
            for (let x = startX; x < endX; x += levelSettings.treeSpacing) {
                maxGeneratedX = x;
                
                // 检查当前应该生成什么类型的障碍物（按节奏顺序）
                const nextObstacleType = getNextObstacleType();
                
                // 只有当应该生成香蕉树时才检查生成
                if (nextObstacleType === 'tree') {
                    // 检查生成概率（使用固定种子的随机数）
                    if (random() <= levelSettings.treeProbability) {
                        // 根据关卡调整最小距离（第一关使用更大的值）
                        const minDistance = (gameState.currentLevel === 0) 
                            ? TREE_CONFIG.minDistanceFromTrapFirstLevel 
                            : TREE_CONFIG.minDistanceFromTrap;
                        
                        // 检查是否与陷阱太近
                        let tooCloseToTrap = false;
                        for (let trap of traps) {
                            if (Math.abs(trap.x - x) < minDistance) {
                                tooCloseToTrap = true;
                                break;
                            }
                        }
                        
                        // 如果距离合适，生成香蕉树
                        if (!tooCloseToTrap) {
                            bananaTrees.push({
                                x: x,
                                y: groundY - TREE_CONFIG.height,
                                width: TREE_CONFIG.width,
                                height: TREE_CONFIG.height,
                                interacted: false // 是否已经交互过
                            });
                            
                            // 推进障碍物生成顺序
                            advanceObstacleSequence();
                        }
                    }
                } else if (nextObstacleType === 'empty') {
                    // 如果是空地，直接推进顺序，不生成任何东西
                    advanceObstacleSequence();
                }
            }
            
            // 更新最后一个香蕉树位置
            lastTreeX = Math.max(lastTreeX, Math.max(maxGeneratedX, endX - levelSettings.treeSpacing));
        }

        // 清理屏幕外的香蕉树
        function cleanupBananaTrees() {
            const keepRange = 500;
            for (let i = bananaTrees.length - 1; i >= 0; i--) {
                if (bananaTrees[i].x < camera.x - keepRange || bananaTrees[i].x > camera.x + GAME_WIDTH + keepRange) {
                    bananaTrees.splice(i, 1);
                }
            }
        }

        // 初始化普通猴子
        function initNormalMonkeys() {
            normalMonkeys.length = 0;
            const safeZone = 600;
            const startX = 100 + safeZone;
            lastNormalMonkeyX = startX;
            generateNormalMonkeys(startX, startX + 2000);
        }

        // 生成普通猴子（使用固定种子）
        function generateNormalMonkeys(startX, endX) {
            const groundY = GROUND_Y;
            const levelSettings = getCurrentLevelSettings();
            
            // 如果关卡没有普通猴子设置，直接返回
            if (!levelSettings.monkeySpacing || levelSettings.monkeyProbability === 0) {
                lastNormalMonkeyX = Math.max(lastNormalMonkeyX, endX);
                return;
            }
            
            // 使用关卡索引作为随机种子，确保每个关卡固定
            const seed = gameState.currentLevel * 4000 + Math.floor(startX / 100);
            const random = seededRandom(seed);
            
            for (let x = startX; x < endX; x += levelSettings.monkeySpacing) {
                // 检查当前应该生成什么类型的障碍物（按节奏顺序）
                const nextObstacleType = getNextObstacleType();
                
                // 只有应该生成普通猴子时才继续
                if (nextObstacleType !== 'monkey' && nextObstacleType !== 'empty') {
                    continue; // 不是普通猴子或空地，跳过（让其他生成函数处理）
                }
                
                // 如果是空地，推进顺序并跳过
                if (nextObstacleType === 'empty') {
                    advanceObstacleSequence();
                    continue;
                }
                
                // 检查生成概率（使用固定种子的随机数）
                if (random() <= levelSettings.monkeyProbability) {
                    // 检查是否与陷阱太近
                    let tooCloseToTrap = false;
                    for (let trap of traps) {
                        if (Math.abs(trap.x - x) < NORMAL_MONKEY_CONFIG.minDistanceFromTrap) {
                            tooCloseToTrap = true;
                            break;
                        }
                    }
                    
                    // 检查是否与香蕉树太近
                    let tooCloseToTree = false;
                    for (let tree of bananaTrees) {
                        if (Math.abs(tree.x - x) < NORMAL_MONKEY_CONFIG.minDistanceFromTree) {
                            tooCloseToTree = true;
                            break;
                        }
                    }
                    
                    // 检查是否与目标猴子太近
                    const distanceToTarget = Math.abs(targetMonkey.x - x);
                    if (distanceToTarget < 200) {
                        tooCloseToTree = true;
                    }
                    
                    // 如果距离合适，生成普通猴子
                    if (!tooCloseToTrap && !tooCloseToTree) {
                        normalMonkeys.push({
                            x: x,
                            y: groundY - NORMAL_MONKEY_CONFIG.height,
                            width: NORMAL_MONKEY_CONFIG.width,
                            height: NORMAL_MONKEY_CONFIG.height,
                            speedX: NORMAL_MONKEY_CONFIG.speedX,
                            speedY: 0,
                            onGround: true,
                            color: NORMAL_MONKEY_CONFIG.color
                        });
                        
                        // 推进障碍物生成顺序
                        advanceObstacleSequence();
                    }
                }
            }
            
            // 更新最后一个普通猴子位置
            lastNormalMonkeyX = Math.max(lastNormalMonkeyX, endX - levelSettings.monkeySpacing);
        }

        // 清理屏幕外的普通猴子
        function cleanupNormalMonkeys() {
            const keepRange = 500;
            for (let i = normalMonkeys.length - 1; i >= 0; i--) {
                if (normalMonkeys[i].x < camera.x - keepRange || 
                    normalMonkeys[i].x > camera.x + GAME_WIDTH + keepRange) {
                    normalMonkeys.splice(i, 1);
                }
            }
        }

        // 动态生成普通猴子（突然出现）
        function spawnDynamicNormalMonkey() {
            const levelSettings = getCurrentLevelSettings();
            
            // 如果当前关卡未启用动态猴子，直接返回
            if (!levelSettings.dynamicMonkeyEnabled) {
                return;
            }
            
            // 在玩家前方一定距离生成（在视野前方但不在屏幕内）
            const spawnDistance = 400; // 在玩家前方400像素
            const spawnX = Math.max(player.x, targetMonkey.x) + spawnDistance;
            const groundY = GROUND_Y;
            
            // 检查生成位置是否合适
            let canSpawn = true;
            
            // 检查是否与陷阱太近
            for (let trap of traps) {
                if (Math.abs(trap.x - spawnX) < NORMAL_MONKEY_CONFIG.minDistanceFromTrap) {
                    canSpawn = false;
                    break;
                }
            }
            
            // 检查是否与香蕉树太近
            if (canSpawn) {
                for (let tree of bananaTrees) {
                    if (Math.abs(tree.x - spawnX) < NORMAL_MONKEY_CONFIG.minDistanceFromTree) {
                        canSpawn = false;
                        break;
                    }
                }
            }
            
            // 检查是否与目标猴子太近
            if (canSpawn) {
                const distanceToTarget = Math.abs(targetMonkey.x - spawnX);
                if (distanceToTarget < 200) {
                    canSpawn = false;
                }
            }
            
            // 检查是否与其他普通猴子太近
            if (canSpawn) {
                for (let monkey of normalMonkeys) {
                    if (Math.abs(monkey.x - spawnX) < 150) {
                        canSpawn = false;
                        break;
                    }
                }
            }
            
            // 如果位置合适，生成动态猴子
            if (canSpawn) {
                normalMonkeys.push({
                    x: spawnX,
                    y: groundY - NORMAL_MONKEY_CONFIG.height,
                    width: NORMAL_MONKEY_CONFIG.width,
                    height: NORMAL_MONKEY_CONFIG.height,
                    speedX: NORMAL_MONKEY_CONFIG.speedX,
                    speedY: 0,
                    onGround: true,
                    color: NORMAL_MONKEY_CONFIG.color,
                    isDynamic: true,  // 标记为动态生成的猴子
                    spawnTime: Date.now()  // 记录生成时间（可用于动画效果）
                });
                
                console.log(`动态生成普通猴子在位置: ${spawnX}`);
            }
        }

        // 检查玩家是否碰到普通猴子（与陷阱碰撞逻辑一致）
        function checkNormalMonkeyCollision() {
            const playerBottom = player.y + player.height;
            const playerTop = player.y;
            const playerLeft = player.x;
            const playerRight = player.x + player.width;

            const collisionBoxWidth = NORMAL_MONKEY_CONFIG.collisionBoxWidth != null
                ? NORMAL_MONKEY_CONFIG.collisionBoxWidth
                : NORMAL_MONKEY_CONFIG.width;
            const collisionBoxOffset = (NORMAL_MONKEY_CONFIG.width - collisionBoxWidth) / 2;

            for (let monkey of normalMonkeys) {
                const monkeyTop = monkey.y;
                const monkeyBottom = monkey.y + monkey.height;
                const monkeyLeft = monkey.x + collisionBoxOffset;
                const monkeyRight = monkey.x + collisionBoxOffset + collisionBoxWidth;

                const horizontalOverlap = playerRight - 80 > monkeyLeft && playerLeft + 20 < monkeyRight;
                const verticalOverlap = playerBottom >= monkeyTop && playerTop <= monkeyBottom;

                if (horizontalOverlap && verticalOverlap) {
                    return true;
                }
            }
            return false;
        }

        // 键盘控制（电脑）
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyW') {
                e.preventDefault();
                if (player.onGround && gameState.running && !gameState.isWorking) {
                    player.speedY = player.jumpPower;
                    player.onGround = false;
                }
            }
            // E键与香蕉树交互（干活）
            if (e.code === 'KeyE') {
                e.preventDefault();
                if (gameState.running && gameState.nearBananaTree && !gameState.isWorking) {
                    interactWithBananaTree(gameState.nearBananaTree, 'work');
                }
            }
            // Q键跳过香蕉树
            if (e.code === 'KeyQ') {
                e.preventDefault();
                if (gameState.running && gameState.nearBananaTree && !gameState.isWorking) {
                    interactWithBananaTree(gameState.nearBananaTree, 'skip');
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // 触摸控制（手机）
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left,
                y: (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top,
                scaleX: scaleX,
                scaleY: scaleY
            };
        }

        function checkVirtualButtonTouch(x, y, scaleX, scaleY) {
            const canvasX = x * scaleX;
            const canvasY = y * scaleY;

            // 检查声音按钮（左上角，始终可点击）
            const soundBtn = virtualButtonPositions.sound;
            if (canvasX >= soundBtn.x && canvasX <= soundBtn.x + soundBtn.width &&
                canvasY >= soundBtn.y && canvasY <= soundBtn.y + soundBtn.height) {
                return 'sound';
            }

            // 检查跳跃按钮（左侧）
            const jumpBtn = virtualButtonPositions.jump;
            if (canvasX >= jumpBtn.x && canvasX <= jumpBtn.x + jumpBtn.width &&
                canvasY >= jumpBtn.y && canvasY <= jumpBtn.y + jumpBtn.height) {
                return 'jump';
            }

            // 检查干活按钮（如果接近香蕉树）
            if (gameState.nearBananaTree && !gameState.isWorking && !gameState.nearBananaTree.interacted) {
                const workBtn = virtualButtonPositions.work;
                if (canvasX >= workBtn.x && canvasX <= workBtn.x + workBtn.width &&
                    canvasY >= workBtn.y && canvasY <= workBtn.y + workBtn.height) {
                    return 'work';
                }
                
                // 检查跳过按钮
                const skipBtn = virtualButtonPositions.skip;
                if (canvasX >= skipBtn.x && canvasX <= skipBtn.x + skipBtn.width &&
                    canvasY >= skipBtn.y && canvasY <= skipBtn.y + skipBtn.height) {
                    // 检查是否有足够的香蕉
                    if (gameState.bananas >= BANANA_SETTINGS.skipCost) {
                        return 'skip';
                    }
                }
            }

            // 检查前进按钮（右侧）
            const rightBtn = virtualButtonPositions.right;
            if (canvasX >= rightBtn.x && canvasX <= rightBtn.x + rightBtn.width &&
                canvasY >= rightBtn.y && canvasY <= rightBtn.y + rightBtn.height) {
                return 'right';
            }

            return null;
        }

        // 检查触摸位置是否在香蕉树上（移动端直接触摸交互）
        function checkBananaTreeTouch(canvasX, canvasY) {
            if (!gameState.running) return null;
            
            for (let tree of bananaTrees) {
                // 将世界坐标转换为屏幕坐标
                const screenX = tree.x - camera.x;
                const screenY = tree.y;
                
                // 检查触摸点是否在香蕉树范围内（扩大触摸区域，更容易点击）
                const touchMargin = 20; // 触摸边距，让点击更容易
                if (canvasX >= screenX - touchMargin && 
                    canvasX <= screenX + TREE_CONFIG.width + touchMargin &&
                    canvasY >= screenY - touchMargin && 
                    canvasY <= screenY + TREE_CONFIG.height + touchMargin) {
                    return tree;
                }
            }
            return null;
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const coords = getCanvasCoordinates(e);
            const touch = e.touches[0];
            const touchX = touch.clientX - canvas.getBoundingClientRect().left;
            const touchY = touch.clientY - canvas.getBoundingClientRect().top;
            const canvasX = touchX * coords.scaleX;
            const canvasY = touchY * coords.scaleY;
            
            // 优先检查声音按钮（始终可点击）
            const soundBtn = virtualButtonPositions.sound;
            if (canvasX >= soundBtn.x && canvasX <= soundBtn.x + soundBtn.width &&
                canvasY >= soundBtn.y && canvasY <= soundBtn.y + soundBtn.height) {
                gameState.musicOn = !gameState.musicOn;
                saveSettings();
                if (gameState.musicOn) {
                    bgMusic.play().catch(err => console.log('音乐播放失败:', err));
                } else {
                    bgMusic.pause();
                }
                return;

            if (!gameState.running || gameState.gameOver || gameState.levelComplete) {

            for (let i = 0; i < e.touches.length; i++) {

                if (button) {

        canvas.addEventListener('touchend', (e) => {

        canvas.addEventListener('touchmove', (e) => {

                const button = checkVirtualButtonTouch(touchX, touchY, coords.scaleX, coords.scaleY);
                const oldButton = activeTouches[touch.identifier];
                
                if (oldButton && oldButton !== button) {
                    virtualButtons[oldButton] = false;

        // 鼠标位置（用于按钮悬停效果）

        canvas.addEventListener('mousemove', (e) => {

            isButtonHovered = isSoundBtnHovered || (mouseX >= btnX && mouseX <= btnX + btnWidth && 
                              mouseY >= btnY && mouseY <= btnY + btnHeight &&

        // Canvas点击事件处理（电脑）
        canvas.addEventListener('click', (e) => {
            if (isMobile) return; // 手机使用触摸事件

            // 如果游戏结束或未开始，点击按钮区域可以重新开始
            if ((!gameState.running || gameState.gameOver || gameState.levelComplete)) {
                // 检查是否点击了说明界面的开始按钮
                if (gameState.currentLevel === 0 && !gameState.tutorialShown.preGameInstructionsShown && !gameState.gameOver) {

                    const boxX = GAME_WIDTH / 2 - boxWidth / 2;
